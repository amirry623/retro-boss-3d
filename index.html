
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Retro Boss 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111827;color:white;font-family:Tahoma,Arial,sans-serif}
#game{position:fixed;inset:0}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
.panel{background:#111827dd;border:2px solid #40e0d0;border-radius:10px;padding:9px 12px;font-size:13px;box-shadow:0 0 12px #00ffff22}
#healthOuter{width:145px;height:12px;background:#492c3a;border-radius:8px;overflow:hidden;margin-top:6px}
#health{height:100%;width:100%;background:#31e981;transition:width .2s}
#bossOuter{width:145px;height:10px;background:#444;border-radius:8px;overflow:hidden;margin-top:5px}
#bossHealth{height:100%;width:100%;background:#ff3860}
#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:27px;color:#70fff3;text-shadow:0 0 8px #00ffff;pointer-events:none}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090d19c9;z-index:5;padding:20px}
#dialog{width:min(440px,100%);padding:24px;text-align:center;border:2px solid #40e0d0;border-radius:18px;background:#131c2d;box-shadow:0 0 35px #00c8bb33}
h1{color:#5fffee;margin:0 0 12px}
button{font-family:inherit;color:white;background:#147f85;border:1px solid #69fff2;border-radius:9px;padding:11px 15px;margin:5px;cursor:pointer;font-size:14px}
button:active{transform:scale(.96)}
.small{font-size:12px;line-height:1.9;color:#d4e4ef}
#mobile{position:fixed;bottom:15px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,45px);gap:4px}
.pad button,.actions button{pointer-events:auto;background:#162a3dcc;border-color:#78fff0aa;touch-action:none}
.pad button{margin:0;padding:4px;font-size:20px}
.actions{display:flex;flex-direction:column;align-items:center}
.actions button{margin:3px;font-size:12px;padding:10px}
#settings{display:none;text-align:right;margin-top:12px}
input[type=range]{width:100%}
@media(min-width:800px){#mobile{opacity:.72}}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="panel">
    <b>❤️ سلامتی</b> <span id="healthText">100</span>
    <div id="healthOuter"><div id="health"></div></div>
  </div>
  <div class="panel">
    <b>👾 مرحله:</b> <span id="stage">1</span> / 8<br>
    <b>🔫 سلاح:</b> <span id="weaponText">Blaster</span>
  </div>
  <div class="panel">
    <b>باس</b> <span id="bossText">100%</span>
    <div id="bossOuter"><div id="bossHealth"></div></div>
  </div>
</div>
<div id="crosshair">+</div>

<div id="overlay">
  <div id="dialog">
    <h1>RETRO BOSS 3D</h1>
    <p id="message">آماده‌ای با ۸ باس مبارزه کنی؟</p>
    <button id="startBtn">شروع بازی</button>
    <button id="settingsBtn">⚙️ تنظیمات</button>
    <div id="settings">
      <label for="volume">سرعت حرکت</label>
      <input id="volume" type="range" min="3" max="12" value="7">
      <p class="small">برای بازگشت، دکمهٔ شروع بازی را بزن.</p>
    </div>
    <p class="small">
      کامپیوتر: حرکت با WASD یا کلیدهای جهت‌دار، شلیک با کلیک، تعویض سلاح با Q، دویدن با Shift.<br>
      موبایل: از دکمه‌های روی صفحه استفاده کن.
    </p>
  </div>
</div>

<div id="mobile">
  <div class="pad">
    <span></span><button data-key="w">▲</button><span></span>
    <button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button>
  </div>
  <div class="actions">
    <button id="shootBtn">🔫 شلیک</button>
    <button id="weaponBtn">تغییر سلاح</button>
    <button id="runBtn">💨 دویدن</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $ = id => document.getElementById(id);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91c9dc);
scene.fog = new THREE.Fog(0x91c9dc, 35, 115);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, .1, 180);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9f5ff,0x354050,2));
const sun = new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-15,30,12);
sun.castShadow = true;
scene.add(sun);

const mat = (color,roughness=.8) => new THREE.MeshStandardMaterial({color,roughness});
const groundMat=mat(0x353b4b), roadMat=mat(0x222936), lineMat=mat(0xf8c957);
const buildingMats=[0x626c80,0x77677c,0x435e73,0x8a795f,0x47566d].map(c=>mat(c));
const solidObjects=[];
function cube(w,h,d,material,x,y,z,collide=false){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);
  if(collide) solidObjects.push({x,z,hw:w/2+.5,hd:d/2+.5});
  return m;
}

// زمین و خیابان
cube(220,.5,220,groundMat,0,-.4,0);
cube(13,.08,210,roadMat,0,-.12,0);
for(let z=-100;z<105;z+=8) cube(.16,.03,3,lineMat,0,-.06,z);

// ساختمان‌ها و پنجره‌های نئونی
for(let z=-95;z<=95;z+=13){
  for(const side of [-1,1]){
    const x=side*(10+Math.random()*3);
    const w=5+Math.random()*3,h=7+Math.random()*17,d=8+Math.random()*4;
    const b=cube(w,h,d,buildingMats[Math.floor(Math.random()*buildingMats.length)],x,h/2-.1,z,true);
    const winMat=mat([0x52e6ff,0xffd166,0xff5e91][Math.floor(Math.random()*3)]);
    for(let y=2;y<h-1;y+=3){
      for(let xx=-w/2+1;xx<w/2;xx+=2){
        const win=new THREE.Mesh(new THREE.BoxGeometry(.7,.9,.08),winMat);
        win.position.set(x+xx,y,z+d/2+.05);scene.add(win);
      }
    }
  }
}

// ابرهای متحرک
const clouds=[];
for(let i=0;i<12;i++){
  const cloud=new THREE.Group();
  const white=mat(0xf4fbff);
  for(let j=0;j<5;j++){
    const puff=new THREE.Mesh(new THREE.SphereGeometry(1.4+Math.random()*.7,10,8),white);
    puff.position.set(j*1.7,Math.random()*.7,Math.random()*.8);
    puff.scale.y=.65;cloud.add(puff);
  }
  cloud.position.set((Math.random()-.5)*100,22+Math.random()*14,-70+Math.random()*140);
  cloud.userData.speed=.7+Math.random()*.8;
  scene.add(cloud);clouds.push(cloud);
}

// شخصیت بازیکن
const player=new THREE.Group();
const body=cube(.9,1.25,.55,mat(0x16c9b5),0,0,0);
body.geometry=new THREE.BoxGeometry(.9,1.25,.55);
body.position.set(0,1.05,0);player.add(body);
const head=new THREE.Mesh(new THREE.BoxGeometry(.65,.65,.65),mat(0xf0c69b));
head.position.y=2;player.add(head);
const visor=new THREE.Mesh(new THREE.BoxGeometry(.48,.2,.08),mat(0x182338));
visor.position.set(0,2.05,-.34);player.add(visor);
const gun=new THREE.Mesh(new THREE.BoxGeometry(.22,.22,.85),mat(0x252a3a));
gun.position.set(.48,1.15,-.55);player.add(gun);
scene.add(player);
player.position.set(0,0,10);

// باس‌ها
let boss=null,bossHP=100,stage=1,health=100,weapon='blaster';
let gameStarted=false,gameOver=false,shootCooldown=0,bossCooldown=2;
const bossMats=[0xff496c,0xff8c42,0xa66bff,0x35a7ff,0x9bff50,0xffd447,0xff59d7,0xf5f5f5];
function makeBoss(){
  if(boss)scene.remove(boss);
  boss=new THREE.Group();
  const color=bossMats[stage-1];
  const bm=mat(color),dark=mat(0x202238),eye=mat(0xffffff);
  const torso=new THREE.Mesh(new THREE.BoxGeometry(2.4,2.8,1.5),bm);
  torso.position.y=2.3;boss.add(torso);
  const head=new THREE.Mesh(new THREE.BoxGeometry(1.7,1.5,1.4),bm);
  head.position.y=4.35;boss.add(head);
  for(const x of [-.42,.42]){
    const e=new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.12),eye);
    e.position.set(x,4.45,-.72);boss.add(e);
    const pupil=new THREE.Mesh(new THREE.BoxGeometry(.12,.16,.08),dark);
    pupil.position.set(x,4.43,-.8);boss.add(pupil);
  }
  for(const x of [-1.55,1.55]){
    const arm=new THREE.Mesh(new THREE.BoxGeometry(.65,2.3,.7),bm);
    arm.position.set(x,2.45,0);boss.add(arm);
    const hand=new THREE.Mesh(new THREE.BoxGeometry(.8,.7,.8),dark);
    hand.position.set(x,1.1,0);boss.add(hand);
  }
  for(const x of [-.7,.7]){
    const leg=new THREE.Mesh(new THREE.BoxGeometry(.75,1.5,.8),dark);
    leg.position.set(x,.75,0);boss.add(leg);
  }
  boss.position.set((stage%2?1:-1)*2,0,-18);
  boss.userData.hitRadius=2.2;
  scene.add(boss);
  bossHP=100;bossCooldown=2;
  updateHUD();
}
function updateHUD(){
  $('health').style.width=health+'%';$('healthText').textContent=Math.ceil(health);
  $('stage').textContent=stage;$('weaponText').textContent=weapon==='blaster'?'Blaster':'Sniper';
  $('bossHealth').style.width=bossHP+'%';$('bossText').textContent=Math.ceil(bossHP)+'%';
}
makeBoss();

// کنترل‌ها
const keys={};
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
  if(e.key.toLowerCase()==='q')switchWeapon();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-key]').forEach(btn=>{
  const k=btn.dataset.key;
  const down=e=>{e.preventDefault();keys[k]=true};
  const up=e=>{e.preventDefault();keys[k]=false};
  btn.addEventListener('pointerdown',down);
  btn.addEventListener('pointerup',up);
  btn.addEventListener('pointerleave',up);
  btn.addEventListener('pointercancel',up);
});
$('runBtn').addEventListener('pointerdown',e=>{e.preventDefault();keys.shift=true});
$('runBtn').addEventListener('pointerup',()=>keys.shift=false);
$('runBtn').addEventListener('pointerleave',()=>keys.shift=false);
$('weaponBtn').onclick=switchWeapon;
function switchWeapon(){
  weapon=weapon==='blaster'?'sniper':'blaster';
  gun.scale.z=weapon==='sniper'?1.6:1;
  updateHUD();
}

// نشانه‌گیری با ماوس یا لمس صفحه
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2(0,0);
let aimPoint=new THREE.Vector3(0,1,-18);
function aimAt(clientX,clientY){
  mouse.x=clientX/innerWidth*2-1;
  mouse.y=-(clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const plane=new THREE.Plane(new THREE.Vector3(0,1,0),-1.3);
  const point=new THREE.Vector3();
  if(raycaster.ray.intersectPlane(plane,point))aimPoint.copy(point);
}
renderer.domElement.addEventListener('pointermove',e=>aimAt(e.clientX,e.clientY));
renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button===0){aimAt(e.clientX,e.clientY);shoot()}
});
$('shootBtn').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});

const bullets=[];
function shoot(){
  if(!gameStarted||gameOver||shootCooldown>0)return;
  shootCooldown=weapon==='sniper'?.65:.22;
  const start=new THREE.Vector3();
  player.localToWorld(start.set(.45,1.25,-.8));
  const target=boss.position.clone().add(new THREE.Vector3(0,2.6,0));
  // اگر نشانه‌گیری دور از باس باشد، شلیک به سمت نشانه انجام می‌شود.
  const direction=aimPoint.clone().sub(start);
  if(direction.length()<1)direction.copy(target).sub(start);
  direction.normalize();
  // پرتابه با برخورد قابل‌اعتماد به باس
  const bullet=new THREE.Mesh(
    new THREE.SphereGeometry(weapon==='sniper'?.16:.09,8,8),
    mat(weapon==='sniper'?0xffd166:0x63fff0)
  );
  bullet.position.copy(start);scene.add(bullet);
  bullets.push({mesh:bullet,dir:direction,speed:weapon==='sniper'?65:48,life:1.5,damage:weapon==='sniper'?28:10});
}

function endGame(won){
  gameOver=true;gameStarted=false;
  $('overlay').style.display='flex';
  $('message').textContent=won?'🏆 پیروزی! تمام ۸ باس را شکست دادی!':'💥 بازی تمام شد! دوباره تلاش کن.';
  $('startBtn').textContent='شروع دوباره';
}
function nextStage(){
  if(stage>=8){endGame(true);return}
  stage++;makeBoss();updateHUD();
}
function damagePlayer(amount){
  health=Math.max(0,health-amount);updateHUD();
  if(health<=0)endGame(false);
}
function resetGame(){
  stage=1;health=100;weapon='blaster';gameOver=false;
  player.position.set(0,0,10);player.rotation.y=0;
  bullets.forEach(b=>scene.remove(b.mesh));bullets.length=0;
  makeBoss();updateHUD();
}
$('startBtn').onclick=()=>{
  if(gameOver)resetGame();
  gameStarted=true;gameOver=false;
  $('overlay').style.display='none';
};
$('settingsBtn').onclick=()=>{
  const s=$('settings');s.style.display=s.style.display==='block'?'none':'block';
};
const speedInput=$('volume');

function blocked(x,z){
  return solidObjects.some(o=>Math.abs(x-o.x)<o.hw&&Math.abs(z-o.z)<o.hd);
}
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);
  clouds.forEach(c=>{
    c.position.x+=c.userData.speed*dt;
    if(c.position.x>65)c.position.x=-65;
  });
  shootCooldown=Math.max(0,shootCooldown-dt);

  if(gameStarted&&!gameOver){
    const move=new THREE.Vector3();
    if(keys.w||keys.arrowup)move.z-=1;
    if(keys.s||keys.arrowdown)move.z+=1;
    if(keys.a||keys.arrowleft)move.x-=1;
    if(keys.d||keys.arrowright)move.x+=1;
    if(move.length()>0){
      move.normalize();
      const speed=Number(speedInput.value)*(keys.shift?1.65:1);
      const nx=player.position.x+move.x*speed*dt;
      const nz=player.position.z+move.z*speed*dt;
      if(!blocked(nx,player.position.z))player.position.x=THREE.MathUtils.clamp(nx,-5.2,5.2);
      if(!blocked(player.position.x,nz))player.position.z=THREE.MathUtils.clamp(nz,-95,95);
    }

    // شخصیت و دوربین رو به باس می‌چرخند
    const dx=boss.position.x-player.position.x;
    const dz=boss.position.z-player.position.z;
    player.rotation.y=Math.atan2(-dx,-dz);
    camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+5.5,player.position.z+10),.09);
    camera.lookAt(player.position.x,1.8,player.position.z-7);

    // حرکت آرام باس و حمله
    boss.position.x+=Math.sin(performance.now()*.0007+stage)*dt*.9;
    boss.position.x=THREE.MathUtils.clamp(boss.position.x,-4.5,4.5);
    boss.rotation.y=Math.sin(performance.now()*.0008)*.12;
    bossCooldown-=dt;
    if(bossCooldown<=0){
      const dist=player.position.distanceTo(boss.position);
      if(dist<32)damagePlayer(stage>=6?9:6);
      bossCooldown=Math.max(.8,2.2-stage*.12);
    }

    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      b.mesh.position.addScaledVector(b.dir,b.speed*dt);
      b.life-=dt;
      const target=boss.position.clone().add(new THREE.Vector3(0,2.5,0));
      if(b.mesh.position.distanceTo(target)<2.0){
        bossHP=Math.max(0,bossHP-b.damage);
        scene.remove(b.mesh);bullets.splice(i,1);updateHUD();
        if(bossHP<=0)nextStage();
      }else if(b.life<=0){
        scene.remove(b.mesh);bullets.splice(i,1);
      }
    }
  }else{
    camera.position.lerp(new THREE.Vector3(0,9,23),.025);
    camera.lookAt(0,2,-8);
  }
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
